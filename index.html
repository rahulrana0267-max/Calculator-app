<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Calculator with Supabase</title>
  
  <!-- Updated CSS with version tag to force layout refresh -->
  <link rel="stylesheet" href="style.css?v=2.0">
  
  <!-- PWA Configuration -->
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="calculator-container">
    <div class="calculator">
      <input type="text" id="display" readonly>
      <div class="buttons">
        <button onclick="clearDisplay()" class="action-btn">C</button>
        <button onclick="appendValue('/')" class="op-btn">÷</button>
        <button onclick="appendValue('*')" class="op-btn">×</button>
        <button onclick="appendValue('-')" class="op-btn">-</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="op-btn">+</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="calculateResult()" class="equal-btn">=</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('0')" class="zero-btn">0</button>
        <button onclick="appendValue('.')">.</button>
      </div>
    </div>

    <!-- Calculations History Side Panel -->
    <div class="history-panel">
      <h3>History (Supabase)</h3>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
